<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the tab bar clears the iPhone's home indicator
         (env(safe-area-inset-bottom)) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The app has a light theme only (form controls, scrollbars) -->
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Gestion de vos finances personnelles" />
    <!-- Opened from the iPhone home screen: full screen, under a regular status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finances" />
    <title>Finance</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
